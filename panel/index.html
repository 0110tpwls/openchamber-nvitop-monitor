<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nvitop GPU Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="root">
    <div id="toolbar">
      <p id="source" class="muted"></p>
      <div id="controls">
        <button id="metric-toggle" type="button" aria-expanded="false" aria-controls="metric-settings">Metrics</button>
        <div id="pause"></div>
      </div>
    </div>
    <div id="metric-settings" hidden>
      <div class="sampling-setting">
        <label for="sampling-interval">Sampling interval (sec) <span class="muted">(1–60)</span></label>
        <input id="sampling-interval" type="number" min="1" max="60" step="1" value="2">
      </div>
      <table aria-label="Metrics to display">
        <thead><tr><th scope="col">Metric</th><th scope="col">Bar</th><th scope="col">Graph</th></tr></thead>
        <tbody id="metric-options"></tbody>
      </table>
    </div>
    <p id="notice" role="status" aria-live="polite">Connecting to OpenChamber…</p>
    <section id="system-section" hidden aria-labelledby="system-title">
      <h2 id="system-title" class="section-title">System</h2>
      <div id="system" class="card"></div>
    </section>
    <section id="gpu-section" hidden aria-labelledby="gpu-title">
      <h2 id="gpu-title" class="section-title">GPU</h2>
      <div id="devices"></div>
    </section>
    <section id="jobs" hidden aria-labelledby="jobs-title">
      <div class="section-heading">
        <div><h2 id="jobs-title">GPU processes</h2><p id="job-count" class="muted"></p></div>
        <div id="search"></div>
      </div>
      <p id="empty" class="muted"></p>
      <div class="table-wrap">
        <table class="process-table">
          <thead><tr>
            <th scope="col" class="pid-col">PID</th><th scope="col" class="gpu-col">GPU</th>
            <th scope="col">Command / User</th><th scope="col" class="vram-col">VRAM ↓</th>
            <th scope="col" class="wide">Type</th><th scope="col" class="wide">SM</th>
            <th scope="col" class="wide">GMBW</th><th scope="col" class="wide">CPU</th>
            <th scope="col" class="wide">MEM</th><th scope="col" class="wide">TIME</th>
          </tr></thead>
          <tbody id="processes"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="command-tooltip" role="tooltip" hidden></div>
  <script src="main.js"></script>
</body>
</html>
